optimizer : {
  type: AdamW,
  kwargs: {
  lr : 0.00001,
  weight_decay : 0.05,
}}

scheduler: {
  type: CosLR,
  kwargs: {
    epochs: 300,
    initial_epochs : 10
}}


# dataset : {
#   train : { _base_: cfgs/dataset_configs/ShapeNet-55.yaml,
#             others: {subset: 'train', npoints: 8192}},
#   val : { _base_: cfgs/dataset_configs/ShapeNet-55.yaml,
#             others: {subset: 'test', npoints: 8192}},
#   test : { _base_: cfgs/dataset_configs/ShapeNet-55.yaml,
#             others: {subset: 'test', npoints: 8192}}}
dataset:
  train:
    _base_: cfgs/dataset_configs/ObjaverseNPY.yaml
    others:
      subset: 'train'
      npoints: 8192
      bs: 8
  val:
    _base_: cfgs/dataset_configs/ObjaverseNPY.yaml
    others:
      subset: 'test'
      npoints: 8192
      bs: 256
  test:
    _base_: cfgs/dataset_configs/ObjaverseNPY.yaml
    others:
      subset: 'test'
      npoints: 8192
      bs: 128

model: {
  NAME: PCP_MAE,
  encoder_type: point_transformer,   # 新增：启用 MiniGPT 兼容 encoder
  group_size: 32,
  num_group: 512,
  point_dims: 6,
  cls_dim: 40,
  use_max_pool: false,
  loss: cdl2,
  pred_loss: l2,
  ita: 0.1,
  pred_pos_transformer_layer: 0,
  add_detach: True,
  transformer_config: {
    mask_ratio: 0.6,
    mask_type: 'rand',
    trans_dim: 384,
    encoder_dims: 256,
    depth: 12,
    drop_path_rate: 0.1,
    num_heads: 6,
    decoder_depth: 4,
    decoder_num_heads: 6,
  },
}


npoints: 8192
total_bs : 64
step_per_update : 8
max_epoch : 300