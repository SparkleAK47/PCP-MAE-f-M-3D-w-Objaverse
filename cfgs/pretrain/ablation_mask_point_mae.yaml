# ============================================================================
# Ablation config: Point-MAE with MaskTransformer (cross-attention) encoder
#
# Differences from ablation_point_mae.yaml:
#   1. No encoder_type → defaults to 'mask_transformer' (cross-attn blocks)
#   2. ita = 0.0 (pure Point-MAE, no center prediction)
#
# This tests whether the cross-attention architecture of the original
# Point-MAE MaskTransformer learns different representations compared
# to the self-attention-only PointTransformer when pre-trained on the
# same Objaverse 660K data.
# ============================================================================
optimizer : {
  type: AdamW,
  kwargs: {
  lr : 0.00001,
  weight_decay : 0.05,
}}

scheduler: {
  type: CosLR,
  kwargs: {
    epochs: 300,
    initial_epochs : 10
}}


dataset:
  train:
    _base_: cfgs/dataset_configs/ObjaverseNPY.yaml
    others:
      subset: 'train'
      npoints: 8192
      bs: 8
  val:
    _base_: cfgs/dataset_configs/ObjaverseNPY.yaml
    others:
      subset: 'test'
      npoints: 8192
      bs: 256
  test:
    _base_: cfgs/dataset_configs/ObjaverseNPY.yaml
    others:
      subset: 'test'
      npoints: 8192
      bs: 128

model: {
  NAME: PCP_MAE,
  # NOTE: no encoder_type key → defaults to MaskTransformer (cross-attention)
  group_size: 32,
  num_group: 512,
  point_dims: 6,                    # XYZ+RGB input (Objaverse)
  cls_dim: 40,
  use_max_pool: false,
  loss: cdl2,
  pred_loss: l2,
  ita: 0.0,                        # Pure Point-MAE, no center prediction
  pred_pos_transformer_layer: 0,
  add_detach: True,
  transformer_config: {
    mask_ratio: 0.6,
    mask_type: 'rand',
    trans_dim: 384,
    encoder_dims: 256,
    depth: 12,
    drop_path_rate: 0.1,
    num_heads: 6,
    decoder_depth: 4,
    decoder_num_heads: 6,
  },
}


npoints: 8192
total_bs : 64
step_per_update : 8
max_epoch : 300
